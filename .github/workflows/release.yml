name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install portable cross compiler
        run: pip install cargo-zigbuild==0.24.0 ziglang==0.14.1
      - name: Build static Linux binary
        run: cargo zigbuild --locked --release -p weiyu-mcp --target ${{ matrix.target }}
      - name: Run smoke checks
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux-arm64" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y qemu-user
            python scripts/smoke.py target/${{ matrix.target }}/release/weiyu-mcp --runner qemu-aarch64
          else
            python scripts/smoke.py target/${{ matrix.target }}/release/weiyu-mcp
          fi
      - name: Package
        run: bash scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: weiyu-mcp-${{ matrix.platform }}
          path: artifacts/weiyu-mcp-${{ matrix.platform }}.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: weiyu-mcp-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
