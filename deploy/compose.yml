services:
  weiyu-mcp:
    image: weiyu-mcp:${WEIYU_IMAGE_TAG:-0.1.0}
    # Some hosts disable Docker's iptables management, which breaks DNS/NAT on
    # user-defined bridges. The default bridge keeps port mapping and works there.
    network_mode: bridge
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/cc-debian12:nonroot}
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
        CARGO_PROFILE_RELEASE_LTO: ${CARGO_PROFILE_RELEASE_LTO:-thin}
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      WEIYU_MCP_TOKEN_FILE: /run/secrets/mcp_token
      WEIYU_COOKIE_FILE: /run/secrets/bilibili_cookie
      WEIYU_ALLOWED_HOSTS: ${WEIYU_PUBLIC_HOST:-localhost}
      WEIYU_RATE_LIMIT: ${WEIYU_RATE_LIMIT:-2}
      WEIYU_MAX_CONCURRENCY: ${WEIYU_MAX_CONCURRENCY:-4}
      WEIYU_TIMEOUT_SECS: ${WEIYU_TIMEOUT_SECS:-45}
      # 默认 false；开启后持有令牌的 AI 可以点赞/投币/收藏/修改稍后再看
      WEIYU_ALLOW_WRITE: ${WEIYU_ALLOW_WRITE:-false}
    secrets:
      - mcp_token
      - bilibili_cookie
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

secrets:
  mcp_token:
    file: ./secrets/mcp-token
  bilibili_cookie:
    file: ./secrets/bilibili.cookie
