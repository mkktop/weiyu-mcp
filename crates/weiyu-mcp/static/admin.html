<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f15">
<title>未雨 MCP 管理台</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0f15;
  --card: #121924;
  --card-2: #0f151e;
  --inset: #0b1118;
  --edge: rgba(148, 163, 184, .14);
  --edge-strong: rgba(148, 163, 184, .28);
  --text: #e8eef6;
  --muted: #8d9cb0;
  --accent: #5aa9ff;
  --accent-2: #37e0e8;
  --pink: #fb7299;
  --ok: #3ddc97;
  --warn: #f5c451;
  --error: #ff7a70;
  --ring: 0 0 0 3px rgba(90, 169, 255, .18);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background:
    radial-gradient(1100px 700px at 88% -12%, rgba(90, 140, 255, .16), transparent 60%),
    radial-gradient(900px 650px at -8% 108%, rgba(55, 224, 232, .10), transparent 55%),
    radial-gradient(rgba(148, 163, 184, .045) 1px, transparent 1px) 0 0 / 26px 26px,
    linear-gradient(180deg, #0b0f15 0%, #0c1118 100%);
  background-attachment: fixed;
}
::selection { background: rgba(90, 169, 255, .35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #263140; border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

.wrap { max-width: 1020px; margin: 0 auto; padding: 36px 20px 56px; }

/* ---------- 顶部品牌 ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #3b82f6 0%, #22d3ee 100%);
  box-shadow: 0 6px 18px rgba(59, 130, 246, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.logo svg { width: 24px; height: 24px; }
h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: .02em;
}
h1 span {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chip {
  display: inline-block;
  padding: 1px 8px;
  margin-left: 8px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  vertical-align: 2px;
}

/* ---------- 卡片 ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card {
  position: relative;
  background: linear-gradient(180deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 42%), var(--card);
  border: 1px solid var(--edge);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 12px 32px rgba(2, 8, 16, .35);
  animation: rise .35s ease both;
}
.card + .card, .grid + .card, .card + .grid { margin-top: 16px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
.card h2 {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 14px;
  font-size: 13px; font-weight: 700;
  letter-spacing: .12em;
  color: var(--muted);
}
.card h2::before {
  content: '';
  width: 4px; height: 14px; border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
}

/* ---------- 状态行 ---------- */
.row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 8px 0;
}
.row + .row { border-top: 1px dashed rgba(148, 163, 184, .12); }
.label { color: var(--muted); flex: none; }
.value { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
.value[data-state="ok"] { color: var(--ok); }
.value[data-state="warn"] { color: var(--warn); }
.value[data-state="error"] { color: var(--error); }
.value[data-state="off"] { color: var(--muted); }

/* ---------- 按钮 ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
button {
  appearance: none;
  background: #1a2330;
  color: var(--text);
  border: 1px solid var(--edge-strong);
  border-radius: 10px;
  padding: 9px 16px;
  font: inherit;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
}
button:hover { border-color: var(--accent); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:focus-visible { outline: none; box-shadow: var(--ring); }
button.primary {
  background: linear-gradient(135deg, #3b82f6, #22d3ee);
  border-color: transparent;
  color: #06121f;
  font-weight: 600;
  box-shadow: 0 6px 16px rgba(59, 130, 246, .30);
}
button.primary:hover { box-shadow: 0 8px 20px rgba(59, 130, 246, .42); }
button.danger {
  background: rgba(255, 122, 112, .08);
  border-color: rgba(255, 122, 112, .38);
  color: #ffb3ad;
}
button.danger:hover { border-color: var(--error); box-shadow: 0 0 0 3px rgba(255, 122, 112, .12); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

/* ---------- 表单 ---------- */
input[type=text], input[type=password], input[type=number] {
  width: 100%;
  background: var(--inset);
  border: 1px solid var(--edge);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font: inherit;
  transition: border-color .12s ease, box-shadow .12s ease;
}
input:hover { border-color: var(--edge-strong); }
input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
label.field { display: block; margin-bottom: 12px; }
label.field span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }

/* 开关 */
.check {
  display: flex; align-items: center; gap: 10px;
  margin: 10px 0 6px;
  cursor: pointer;
  user-select: none;
}
.check input {
  appearance: none;
  -webkit-appearance: none;
  width: 40px; height: 22px; flex: none;
  margin: 0;
  border-radius: 999px;
  background: #232d3a;
  border: 1px solid var(--edge);
  position: relative;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.check input::after {
  content: '';
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #93a3b8;
  transition: transform .15s ease, background .15s ease;
}
.check input:checked {
  background: linear-gradient(135deg, #3b82f6, #22d3ee);
  border-color: transparent;
}
.check input:checked::after { transform: translateX(18px); background: #fff; }
.check input:focus-visible { outline: none; box-shadow: var(--ring); }
.check span { font-size: 13px; }

/* ---------- 提示条 ---------- */
.msg {
  margin: 14px 0;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--edge);
  background: rgba(148, 163, 184, .06);
  display: none;
}
.msg.show { display: block; animation: rise .25s ease both; }
.msg.ok { border-color: rgba(61, 220, 151, .4); background: rgba(61, 220, 151, .08); color: #a7f3cf; }
.msg.warn { border-color: rgba(245, 196, 81, .4); background: rgba(245, 196, 81, .08); color: #ffe3a1; }
.msg.error { border-color: rgba(255, 122, 112, .45); background: rgba(255, 122, 112, .08); color: #ffc4bf; }

/* ---------- 二维码 ---------- */
.qr-wrap {
  position: relative;
  border-radius: 16px;
  padding: 1px;
  background: linear-gradient(150deg, rgba(90, 169, 255, .55), rgba(55, 224, 232, .25) 45%, rgba(251, 114, 153, .35));
}
.qr-box {
  display: flex; align-items: center; justify-content: center;
  min-height: 288px;
  background: #fff;
  border-radius: 15px;
  padding: 14px;
}
.qr-box svg { width: 256px; height: 256px; display: block; }
.qr-status {
  color: var(--muted);
  text-align: center;
  margin-top: 12px;
  min-height: 24px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.qr-status.on::before {
  content: '';
  width: 12px; height: 12px; flex: none;
  border-radius: 50%;
  border: 2px solid var(--edge-strong);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 登录页 ---------- */
.login {
  max-width: 420px;
  margin: 9vh auto 0;
  padding: 30px 28px 26px;
  text-align: left;
}
.login .brand { margin-bottom: 18px; }
.login h2 { font-size: 16px; margin: 0 0 6px; }
.login p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
.login .actions { margin-top: 18px; }
.login .actions .primary { flex: 1; }

.muted { color: var(--muted); }
.note {
  font-size: 12.5px;
  color: var(--muted);
  background: rgba(148, 163, 184, .06);
  border: 1px dashed var(--edge);
  border-radius: 10px;
  padding: 9px 12px;
  margin: 8px 0 2px;
}
.note + .note { margin-top: 8px; }
.note.warn {
  border-color: rgba(245, 196, 81, .45);
  background: rgba(245, 196, 81, .08);
  color: #ffe3a1;
}
#restart-note { margin-top: 10px; }
#restart-note:empty { display: none; }
.hidden { display: none !important; }

/* ---------- 页头 / 页脚 ---------- */
header.app {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--edge);
}
header.app .actions { margin-top: 0; }
footer {
  color: var(--muted);
  font-size: 12px;
  margin-top: 26px;
  text-align: center;
}
code {
  background: var(--inset);
  border: 1px solid var(--edge);
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 12.5px;
}
@media (max-width: 560px) {
  .wrap { padding: 22px 14px 40px; }
  header.app { flex-direction: column; align-items: flex-start; }
  .login { margin-top: 5vh; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="auth-panel" class="login card hidden">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3C6.9 3 3 6.7 3 11.2c0 .4.3.8.8.8h16.4c.5 0 .8-.4.8-.8C21 6.7 17.1 3 12 3z" fill="#fff"/>
          <path d="M12 12v6.4a2.1 2.1 0 0 1-4.2 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="6.2" cy="19.4" r="1.1" fill="#fff"/>
          <circle cx="18.6" cy="19.8" r="1" fill="#fff"/>
        </svg>
      </span>
      <div>
        <h1>未雨 <span>MCP</span></h1>
        <div class="sub">Bilibili 查询服务管理台</div>
      </div>
    </div>
    <h2 id="auth-title" style="font-size:16px;margin:6px 0 4px">管理台登录</h2>
    <p id="auth-hint">输入管理密码。</p>
    <label class="field">
      <span id="auth-label">管理密码</span>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="输入管理密码">
    </label>
    <div class="actions">
      <button class="primary" id="auth-submit">登录</button>
    </div>
    <div id="auth-msg" class="msg"></div>
  </div>

  <div id="app" class="hidden">
    <header class="app">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.9 3 3 6.7 3 11.2c0 .4.3.8.8.8h16.4c.5 0 .8-.4.8-.8C21 6.7 17.1 3 12 3z" fill="#fff"/>
            <path d="M12 12v6.4a2.1 2.1 0 0 1-4.2 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="6.2" cy="19.4" r="1.1" fill="#fff"/>
            <circle cx="18.6" cy="19.8" r="1" fill="#fff"/>
          </svg>
        </span>
        <div>
          <h1>未雨 <span>MCP</span> 管理台</h1>
          <div class="sub" id="header-sub">正在加载…</div>
        </div>
      </div>
      <div class="actions">
        <button id="refresh">刷新</button>
        <button class="danger" id="token-logout">退出管理台</button>
      </div>
    </header>

    <div id="msg" class="msg"></div>

    <div class="grid">
      <section class="card">
        <h2>服务状态</h2>
        <div class="row"><span class="label">版本</span><span class="value" id="version">-</span></div>
        <div class="row"><span class="label">运行时长</span><span class="value" id="uptime">-</span></div>
        <div class="row"><span class="label">工具</span><span class="value" id="tools">-</span></div>
        <div class="row"><span class="label">B站登录</span><span class="value" id="credential">-</span></div>
        <div class="row"><span class="label">写入能力</span><span class="value" id="write">-</span></div>
        <div class="row"><span class="label">评论写入</span><span class="value" id="comment">-</span></div>
        <div class="row"><span class="label">数据目录</span><span class="value" id="data-dir">-</span></div>
        <div class="row"><span class="label">管理密码</span><span class="value" id="admin-password">-</span></div>
      </section>

      <section class="card">
        <h2>B站扫码登录</h2>
        <div class="qr-wrap">
          <div class="qr-box" id="qr-box"><span class="muted">点击下方按钮生成二维码</span></div>
        </div>
        <div class="qr-status" id="qr-status"></div>
        <div class="actions">
          <button class="primary" id="qr-start">生成登录二维码</button>
          <button id="verify">验证登录态</button>
        </div>
        <div class="row" style="margin-top:8px"><span class="label">当前账号</span><span class="value" id="user">-</span></div>
        <div class="actions">
          <button class="danger" id="logout">退出登录</button>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>运行设置</h2>
      <div class="grid">
        <label class="field">
          <span>每秒查询数（0 = 不限）</span>
          <input id="rate-limit" type="number" min="0" max="100" step="1">
        </label>
        <label class="field">
          <span>最大并发（修改后需重启容器）</span>
          <input id="max-concurrency" type="number" min="1" max="64" step="1">
        </label>
        <label class="field">
          <span>查询超时（秒）</span>
          <input id="timeout-secs" type="number" min="1" max="600" step="1">
        </label>
      </div>
      <label class="check">
        <input id="allow-write" type="checkbox">
        <span>启用互动写入工具（点赞 / 投币 / 收藏 / 稍后再看）</span>
      </label>
      <label class="check">
        <input id="allow-comment" type="checkbox">
        <span>启用评论工具（公开评论 / 回复 / @用户）</span>
      </label>
      <div class="note">
        评论会以真实账号公开发言，回复和 @ 会给对方发送通知；此开关独立于互动写入，建议只在需要时开启。
      </div>
      <div class="note" id="restart-note"></div>
      <div class="actions">
        <button class="primary" id="save-settings">保存设置</button>
      </div>
    </section>

    <section class="card">
      <h2>管理密码</h2>
      <div class="note" id="password-note" style="display:none"></div>
      <div class="grid">
        <label class="field">
          <span>当前密码</span>
          <input id="current-password" type="password" autocomplete="current-password">
        </label>
        <label class="field">
          <span>新密码</span>
          <input id="new-password" type="password" autocomplete="new-password">
        </label>
        <label class="field">
          <span>确认新密码</span>
          <input id="confirm-password" type="password" autocomplete="new-password">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="change-password">修改管理密码</button>
      </div>
    </section>

    <footer>未雨 MCP · 管理接口同样使用 Bearer 令牌保护</footer>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SESSION_KEY = 'weiyu_admin_session';
  let session = sessionStorage.getItem(SESSION_KEY) || '';
  let authMode = 'login';
  let qrKey = null;
  let pollTimer = null;

  sessionStorage.removeItem('weiyu_admin_token');

  let msgTimer = null;
  function showMsg(text, kind) {
    const el = $('msg');
    el.className = 'msg show' + (kind ? ' ' + kind : '');
    el.textContent = text;
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(() => {
      el.className = 'msg';
      el.textContent = '';
    }, 8000);
  }
  function clearMsg() {
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = null;
    const el = $('msg');
    el.className = 'msg';
    el.textContent = '';
  }
  function showAuthError(text) {
    const el = $('auth-msg');
    el.className = 'msg show error';
    el.textContent = text;
  }
  function setState(id, state) {
    const el = $(id);
    if (state) el.dataset.state = state;
    else delete el.dataset.state;
  }
  function showAuthMode(mode) {
    authMode = mode;
    clearMsg();
    $('auth-panel').classList.remove('hidden');
    $('app').classList.add('hidden');
    const msg = $('auth-msg');
    msg.className = 'msg';
    msg.textContent = '';
    if (mode === 'setup') {
      $('auth-title').textContent = '设置管理密码';
      $('auth-hint').textContent =
        '首次使用，请设置管理密码。默认 admin，可直接使用或修改；建议设置后尽快改成你自己的密码。';
      $('auth-label').textContent = '新管理密码';
      $('auth-password').value = 'admin';
      $('auth-password').placeholder = '默认 admin';
      $('auth-password').autocomplete = 'new-password';
      $('auth-submit').textContent = '保存并进入';
    } else {
      $('auth-title').textContent = '管理台登录';
      $('auth-hint').textContent = '输入管理密码。';
      $('auth-label').textContent = '管理密码';
      $('auth-password').value = '';
      $('auth-password').placeholder = '输入管理密码';
      $('auth-password').autocomplete = 'current-password';
      $('auth-submit').textContent = '登录';
    }
    $('auth-password').focus();
  }
  function showApp() {
    $('auth-panel').classList.add('hidden');
    $('app').classList.remove('hidden');
  }
  function fmtUptime(seconds) {
    seconds = Number(seconds || 0);
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (d > 0) return `${d} 天 ${h} 小时`;
    if (h > 0) return `${h} 小时 ${m} 分`;
    return `${m} 分 ${seconds % 60} 秒`;
  }
  async function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (session) headers['Authorization'] = 'Bearer ' + session;
    if (options.body) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, Object.assign({}, options, { headers }));
    let data = null;
    try {
      data = await response.json();
    } catch (_) {}
    if (response.status === 401) {
      session = '';
      sessionStorage.removeItem(SESSION_KEY);
      await loadAuthState();
      throw new Error('认证失败，请重新登录');
    }
    if (!response.ok) {
      const error = new Error(
        (data && data.error && data.error.message) || response.statusText
      );
      error.status = response.status;
      error.code = data && data.error && data.error.code;
      throw error;
    }
    return data;
  }

  async function loadAuthState() {
    try {
      const headers = session ? { Authorization: 'Bearer ' + session } : {};
      const response = await fetch('/admin/api/auth/state', { headers });
      const data = await response.json();
      if (data.authenticated) {
        showApp();
        await refreshStatus();
        return;
      }
      if (data.needs_setup) {
        showAuthMode('setup');
        return;
      }
      showAuthMode('login');
    } catch (error) {
      showAuthMode('login');
      showAuthError('无法连接服务：' + error.message);
    }
  }

  async function submitAuth() {
    const raw = $('auth-password').value.trim();
    const password = raw || (authMode === 'setup' ? 'admin' : '');
    if (!password) {
      showAuthError('请输入管理密码');
      return;
    }
    const path =
      authMode === 'setup'
        ? '/admin/api/auth/setup'
        : '/admin/api/auth/login';
    try {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (
          data.error &&
          (data.error.code === 'CONFLICT' || data.error.code === 'SETUP_REQUIRED')
        ) {
          await loadAuthState();
          return;
        }
        throw new Error(
          (data.error && data.error.message) || response.statusText
        );
      }
      session = data.session;
      sessionStorage.setItem(SESSION_KEY, session);
      clearMsg();
      showApp();
      await refreshStatus();
      if (data.using_default_password) {
        showMsg('已使用默认密码 admin，建议在“管理密码”里尽快修改', 'warn');
      }
    } catch (error) {
      showAuthError(error.message);
    }
  }

  async function refreshStatus() {
    try {
      const data = await api('/admin/api/status');
      showApp();
      $('header-sub').textContent = `v${data.version} · uptime ${fmtUptime(
        data.uptime_secs
      )}`;
      $('version').textContent = data.version;
      $('uptime').textContent = fmtUptime(data.uptime_secs);
      $('tools').textContent = `${data.read_tools} 只读 / ${data.write_tools} 含写入`;
      $('credential').textContent = data.credential_configured
        ? `已配置（${data.credential_source}）`
        : '未登录';
      setState('credential', data.credential_configured ? 'ok' : 'error');
      const writeState = data.write_enabled
        ? data.write_ready ? 'ok' : 'warn'
        : 'off';
      $('write').textContent = data.write_enabled
        ? data.write_ready
          ? '已开启，Cookie 可写'
          : '已开启，但 Cookie 缺少 bili_jct'
        : '未开启';
      setState('write', writeState);
      $('comment').textContent = data.comment_enabled
        ? data.write_ready
          ? '已开启，Cookie 可写'
          : '已开启，但 Cookie 缺少 bili_jct'
        : '未开启';
      setState('comment', data.comment_enabled ? writeState : 'off');
      $('data-dir').textContent = data.data_dir || '未配置（无法持久化）';
      $('admin-password').textContent = data.using_default_password
        ? '默认 admin（建议修改）'
        : '已自定义';
      setState('admin-password', data.using_default_password ? 'warn' : 'ok');
      const note = $('password-note');
      note.textContent = data.using_default_password
        ? '当前使用默认密码 admin，建议立即修改。'
        : '';
      note.style.display = data.using_default_password ? '' : 'none';
      note.classList.toggle('warn', !!data.using_default_password);
      $('rate-limit').value = data.settings.rate_limit;
      $('max-concurrency').value = data.settings.max_concurrency;
      $('timeout-secs').value = data.settings.timeout_secs;
      $('allow-write').checked = !!data.settings.allow_write;
      $('allow-comment').checked = !!data.settings.allow_comment;
      $('restart-note').textContent = data.restart_required
        ? '并发数已修改，需要重启容器后生效。'
        : '';
      if (!data.credential_configured) $('user').textContent = '-';
    } catch (error) {
      if (!session) return;
      showMsg(error.message, 'error');
    }
  }

  async function verifyLogin() {
    try {
      const data = await api('/admin/api/login/verify', { method: 'POST' });
      $('user').textContent = `${data.user.uname} (mid ${data.user.mid})`;
      showMsg('登录态有效', 'ok');
    } catch (error) {
      showMsg(error.message, 'warn');
    }
  }

  function stopPolling() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = null;
    qrKey = null;
    $('qr-status').classList.remove('on');
  }

  async function pollLogin() {
    if (!qrKey || !session) return;
    try {
      const data = await api(
        '/admin/api/login/poll?key=' + encodeURIComponent(qrKey)
      );
      $('qr-status').textContent = data.message || '';
      if (data.status === 'success') {
        stopPolling();
        await refreshStatus();
        await verifyLogin();
        if (data.warning) showMsg(data.warning, 'warn');
        else showMsg('B站登录成功，Cookie 已更新', 'ok');
        return;
      }
      if (data.status === 'expired' || data.status === 'error') {
        stopPolling();
        return;
      }
      $('qr-status').classList.add('on');
      pollTimer = setTimeout(pollLogin, 2000);
    } catch (error) {
      stopPolling();
      showMsg(error.message, 'error');
    }
  }

  async function logoutSession() {
    stopPolling();
    try {
      await api('/admin/api/auth/logout', { method: 'POST' });
    } catch (_) {}
    session = '';
    sessionStorage.removeItem(SESSION_KEY);
    showAuthMode('login');
  }

  async function changePassword() {
    const current = $('current-password').value;
    const next = $('new-password').value.trim();
    const confirm = $('confirm-password').value.trim();
    if (!current) {
      showMsg('请输入当前密码', 'error');
      return;
    }
    if (next.length < 4) {
      showMsg('新密码至少 4 个字符', 'error');
      return;
    }
    if (next !== confirm) {
      showMsg('两次输入的新密码不一致', 'error');
      return;
    }
    try {
      const data = await api('/admin/api/auth/password', {
        method: 'POST',
        body: JSON.stringify({
          current_password: current,
          new_password: next,
        }),
      });
      if (data.session) {
        session = data.session;
        sessionStorage.setItem(SESSION_KEY, session);
      }
      $('current-password').value = '';
      $('new-password').value = '';
      $('confirm-password').value = '';
      showMsg('管理密码已修改', 'ok');
      await refreshStatus();
    } catch (error) {
      showMsg(error.message, 'error');
    }
  }

  $('auth-submit').addEventListener('click', submitAuth);
  $('auth-password').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') submitAuth();
  });
  $('token-logout').addEventListener('click', logoutSession);
  $('refresh').addEventListener('click', () => {
    clearMsg();
    refreshStatus();
  });
  $('verify').addEventListener('click', verifyLogin);
  $('logout').addEventListener('click', async () => {
    if (!confirm('确定退出 B站登录？会清除服务器上的数据目录 Cookie。')) return;
    try {
      const data = await api('/admin/api/logout', { method: 'POST' });
      stopPolling();
      $('user').textContent = '-';
      $('qr-box').innerHTML =
        '<span class="muted">点击下方按钮生成二维码</span>';
      $('qr-status').textContent = '';
      await refreshStatus();
      if (data.warning) showMsg(data.warning, 'warn');
      else showMsg('已退出 B站登录', 'ok');
    } catch (error) {
      showMsg(error.message, 'error');
    }
  });
  $('qr-start').addEventListener('click', async () => {
    stopPolling();
    $('qr-status').textContent = '正在生成二维码…';
    try {
      const data = await api('/admin/api/login/qrcode', { method: 'POST' });
      qrKey = data.qrcode_key;
      $('qr-box').innerHTML = data.svg;
      $('qr-status').textContent = '请使用哔哩哔哩 App 扫码';
      $('qr-status').classList.add('on');
      pollTimer = setTimeout(pollLogin, 2000);
    } catch (error) {
      $('qr-status').textContent = '';
      $('qr-status').classList.remove('on');
      showMsg(error.message, 'error');
    }
  });
  $('save-settings').addEventListener('click', async () => {
    const payload = {
      rate_limit: Number($('rate-limit').value),
      max_concurrency: Number($('max-concurrency').value),
      timeout_secs: Number($('timeout-secs').value),
      allow_write: $('allow-write').checked,
      allow_comment: $('allow-comment').checked,
    };
    try {
      const data = await api('/admin/api/settings', {
        method: 'PUT',
        body: JSON.stringify(payload),
      });
      await refreshStatus();
      showMsg(
        data.restart_required
          ? '设置已保存；并发数需要重启容器后生效'
          : '设置已保存并即时生效',
        data.restart_required ? 'warn' : 'ok'
      );
    } catch (error) {
      showMsg(error.message, 'error');
    }
  });
  $('change-password').addEventListener('click', changePassword);

  loadAuthState();
})();

</script>
</body>
</html>
