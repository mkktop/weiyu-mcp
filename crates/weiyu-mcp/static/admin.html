<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未雨 MCP 管理台</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1216;
  --panel: #171c22;
  --panel-2: #1e252d;
  --border: #2b3440;
  --text: #e6edf3;
  --muted: #8b98a5;
  --accent: #4fb3ff;
  --ok: #3fb950;
  --warn: #d29922;
  --error: #f85149;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at top left, #18212b 0, var(--bg) 45%);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card {
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
}
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.row + .row { border-top: 1px dashed rgba(255,255,255,.05); }
.label { color: var(--muted); }
.value { text-align: right; word-break: break-all; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.6); }
.dot.warn { background: var(--warn); }
.dot.error { background: var(--error); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button {
  background: #25303b;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: #1b4f78; border-color: #2b6f9f; }
button.danger { background: #4a1f22; border-color: #7a2f35; }
button:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=password], input[type=number] {
  width: 100%;
  background: #0e1318;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 11px;
  font: inherit;
}
input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.check { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.check input { width: 16px; height: 16px; }
.msg { margin: 12px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #10161c; display: none; }
.msg.show { display: block; }
.msg.ok { border-color: #2f6f3a; color: #9be6a7; }
.msg.warn { border-color: #6e5a22; color: #e6cf8b; }
.msg.error { border-color: #7a2f35; color: #ffb3b8; }
.qr-box { display: flex; align-items: center; justify-content: center; min-height: 280px; background: #fff; border-radius: 10px; padding: 10px; }
.qr-box svg { width: 260px; height: 260px; }
.qr-status { color: var(--muted); text-align: center; margin-top: 10px; min-height: 22px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.login { max-width: 420px; margin: 10vh auto 0; }
.login h1 { margin-bottom: 8px; }
.login p { color: var(--muted); }
footer { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
code { background: #0e1318; padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="auth-panel" class="login hidden">
    <h1>未雨 <span>MCP</span></h1>
    <h2 id="auth-title" style="font-size:16px;margin:0 0 8px">管理台登录</h2>
    <p id="auth-hint">输入管理密码。</p>
    <label class="field">
      <span id="auth-label">管理密码</span>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="输入管理密码">
    </label>
    <div class="actions">
      <button class="primary" id="auth-submit">登录</button>
    </div>
    <div id="auth-msg" class="msg"></div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <h1>未雨 <span>MCP</span> 管理台</h1>
        <div class="sub" id="header-sub">正在加载…</div>
      </div>
      <div class="actions">
        <button id="refresh">刷新</button>
        <button class="danger" id="token-logout">退出管理台</button>
      </div>
    </header>

    <div id="msg" class="msg"></div>

    <div class="grid">
      <section class="card">
        <h2>服务状态</h2>
        <div class="row"><span class="label">版本</span><span class="value" id="version">-</span></div>
        <div class="row"><span class="label">运行时长</span><span class="value" id="uptime">-</span></div>
        <div class="row"><span class="label">工具</span><span class="value" id="tools">-</span></div>
        <div class="row"><span class="label">B站登录</span><span class="value" id="credential">-</span></div>
        <div class="row"><span class="label">写入能力</span><span class="value" id="write">-</span></div>
        <div class="row"><span class="label">数据目录</span><span class="value" id="data-dir">-</span></div>
        <div class="row"><span class="label">管理密码</span><span class="value" id="admin-password">-</span></div>
      </section>

      <section class="card">
        <h2>B站扫码登录</h2>
        <div class="qr-box" id="qr-box"><span class="muted">点击下方按钮生成二维码</span></div>
        <div class="qr-status" id="qr-status"></div>
        <div class="actions">
          <button class="primary" id="qr-start">生成登录二维码</button>
          <button id="verify">验证登录态</button>
        </div>
        <div class="row"><span class="label">当前账号</span><span class="value" id="user">-</span></div>
        <div class="actions">
          <button class="danger" id="logout">退出登录</button>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:16px">
      <h2>运行设置</h2>
      <div class="grid">
        <label class="field">
          <span>每秒查询数（0 = 不限）</span>
          <input id="rate-limit" type="number" min="0" max="100" step="1">
        </label>
        <label class="field">
          <span>最大并发（修改后需重启容器）</span>
          <input id="max-concurrency" type="number" min="1" max="64" step="1">
        </label>
        <label class="field">
          <span>查询超时（秒）</span>
          <input id="timeout-secs" type="number" min="1" max="600" step="1">
        </label>
      </div>
      <label class="check">
        <input id="allow-write" type="checkbox">
        <span>启用互动写入工具（点赞 / 投币 / 收藏 / 稍后再看）</span>
      </label>
      <div class="muted" id="restart-note"></div>
      <div class="actions">
        <button class="primary" id="save-settings">保存设置</button>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>管理密码</h2>
      <div class="muted" id="password-note"></div>
      <div class="grid">
        <label class="field">
          <span>当前密码</span>
          <input id="current-password" type="password" autocomplete="current-password">
        </label>
        <label class="field">
          <span>新密码</span>
          <input id="new-password" type="password" autocomplete="new-password">
        </label>
        <label class="field">
          <span>确认新密码</span>
          <input id="confirm-password" type="password" autocomplete="new-password">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="change-password">修改管理密码</button>
      </div>
    </section>

    <footer>未雨 MCP · 管理接口同样使用 Bearer 令牌保护</footer>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SESSION_KEY = 'weiyu_admin_session';
  let session = sessionStorage.getItem(SESSION_KEY) || '';
  let authMode = 'login';
  let qrKey = null;
  let pollTimer = null;

  sessionStorage.removeItem('weiyu_admin_token');

  function showMsg(text, kind) {
    const el = $('msg');
    el.className = 'msg show' + (kind ? ' ' + kind : '');
    el.textContent = text;
  }
  function clearMsg() {
    const el = $('msg');
    el.className = 'msg';
    el.textContent = '';
  }
  function showAuthError(text) {
    const el = $('auth-msg');
    el.className = 'msg show error';
    el.textContent = text;
  }
  function showAuthMode(mode) {
    authMode = mode;
    clearMsg();
    $('auth-panel').classList.remove('hidden');
    $('app').classList.add('hidden');
    const msg = $('auth-msg');
    msg.className = 'msg';
    msg.textContent = '';
    if (mode === 'setup') {
      $('auth-title').textContent = '设置管理密码';
      $('auth-hint').textContent =
        '首次使用，请设置管理密码。默认 admin，可直接使用或修改；建议设置后尽快改成你自己的密码。';
      $('auth-label').textContent = '新管理密码';
      $('auth-password').value = 'admin';
      $('auth-password').placeholder = '默认 admin';
      $('auth-password').autocomplete = 'new-password';
      $('auth-submit').textContent = '保存并进入';
    } else {
      $('auth-title').textContent = '管理台登录';
      $('auth-hint').textContent = '输入管理密码。';
      $('auth-label').textContent = '管理密码';
      $('auth-password').value = '';
      $('auth-password').placeholder = '输入管理密码';
      $('auth-password').autocomplete = 'current-password';
      $('auth-submit').textContent = '登录';
    }
    $('auth-password').focus();
  }
  function showApp() {
    $('auth-panel').classList.add('hidden');
    $('app').classList.remove('hidden');
  }
  function fmtUptime(seconds) {
    seconds = Number(seconds || 0);
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (d > 0) return `${d} 天 ${h} 小时`;
    if (h > 0) return `${h} 小时 ${m} 分`;
    return `${m} 分 ${seconds % 60} 秒`;
  }
  async function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (session) headers['Authorization'] = 'Bearer ' + session;
    if (options.body) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, Object.assign({}, options, { headers }));
    let data = null;
    try {
      data = await response.json();
    } catch (_) {}
    if (response.status === 401) {
      session = '';
      sessionStorage.removeItem(SESSION_KEY);
      await loadAuthState();
      throw new Error('认证失败，请重新登录');
    }
    if (!response.ok) {
      const error = new Error(
        (data && data.error && data.error.message) || response.statusText
      );
      error.status = response.status;
      error.code = data && data.error && data.error.code;
      throw error;
    }
    return data;
  }

  async function loadAuthState() {
    try {
      const headers = session ? { Authorization: 'Bearer ' + session } : {};
      const response = await fetch('/admin/api/auth/state', { headers });
      const data = await response.json();
      if (data.authenticated) {
        showApp();
        await refreshStatus();
        return;
      }
      if (data.needs_setup) {
        showAuthMode('setup');
        return;
      }
      showAuthMode('login');
    } catch (error) {
      showAuthMode('login');
      showAuthError('无法连接服务：' + error.message);
    }
  }

  async function submitAuth() {
    const raw = $('auth-password').value.trim();
    const password = raw || (authMode === 'setup' ? 'admin' : '');
    if (!password) {
      showAuthError('请输入管理密码');
      return;
    }
    const path =
      authMode === 'setup'
        ? '/admin/api/auth/setup'
        : '/admin/api/auth/login';
    try {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (
          data.error &&
          (data.error.code === 'CONFLICT' || data.error.code === 'SETUP_REQUIRED')
        ) {
          await loadAuthState();
          return;
        }
        throw new Error(
          (data.error && data.error.message) || response.statusText
        );
      }
      session = data.session;
      sessionStorage.setItem(SESSION_KEY, session);
      clearMsg();
      showApp();
      await refreshStatus();
      if (data.using_default_password) {
        showMsg('已使用默认密码 admin，建议在“管理密码”里尽快修改', 'warn');
      }
    } catch (error) {
      showAuthError(error.message);
    }
  }

  async function refreshStatus() {
    try {
      const data = await api('/admin/api/status');
      showApp();
      $('header-sub').textContent = `v${data.version} · uptime ${fmtUptime(
        data.uptime_secs
      )}`;
      $('version').textContent = data.version;
      $('uptime').textContent = fmtUptime(data.uptime_secs);
      $('tools').textContent = `${data.read_tools} 只读 / ${data.write_tools} 含写入`;
      $('credential').textContent = data.credential_configured
        ? `已配置（${data.credential_source}）`
        : '未登录';
      $('write').textContent = data.write_enabled
        ? data.write_ready
          ? '已开启，Cookie 可写'
          : '已开启，但 Cookie 缺少 bili_jct'
        : '未开启';
      $('data-dir').textContent = data.data_dir || '未配置（无法持久化）';
      $('admin-password').textContent = data.using_default_password
        ? '默认 admin（建议修改）'
        : '已自定义';
      $('password-note').textContent = data.using_default_password
        ? '当前使用默认密码 admin，建议立即修改。'
        : '';
      $('rate-limit').value = data.settings.rate_limit;
      $('max-concurrency').value = data.settings.max_concurrency;
      $('timeout-secs').value = data.settings.timeout_secs;
      $('allow-write').checked = !!data.settings.allow_write;
      $('restart-note').textContent = data.restart_required
        ? '并发数已修改，需要重启容器后生效。'
        : '';
      if (!data.credential_configured) $('user').textContent = '-';
    } catch (error) {
      if (!session) return;
      showMsg(error.message, 'error');
    }
  }

  async function verifyLogin() {
    try {
      const data = await api('/admin/api/login/verify', { method: 'POST' });
      $('user').textContent = `${data.user.uname} (mid ${data.user.mid})`;
      showMsg('登录态有效', 'ok');
    } catch (error) {
      showMsg(error.message, 'warn');
    }
  }

  function stopPolling() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = null;
    qrKey = null;
  }

  async function pollLogin() {
    if (!qrKey || !session) return;
    try {
      const data = await api(
        '/admin/api/login/poll?key=' + encodeURIComponent(qrKey)
      );
      $('qr-status').textContent = data.message || '';
      if (data.status === 'success') {
        stopPolling();
        await refreshStatus();
        await verifyLogin();
        if (data.warning) showMsg(data.warning, 'warn');
        else showMsg('B站登录成功，Cookie 已更新', 'ok');
        return;
      }
      if (data.status === 'expired' || data.status === 'error') {
        stopPolling();
        return;
      }
      pollTimer = setTimeout(pollLogin, 2000);
    } catch (error) {
      stopPolling();
      showMsg(error.message, 'error');
    }
  }

  async function logoutSession() {
    stopPolling();
    try {
      await api('/admin/api/auth/logout', { method: 'POST' });
    } catch (_) {}
    session = '';
    sessionStorage.removeItem(SESSION_KEY);
    showAuthMode('login');
  }

  async function changePassword() {
    const current = $('current-password').value;
    const next = $('new-password').value.trim();
    const confirm = $('confirm-password').value.trim();
    if (!current) {
      showMsg('请输入当前密码', 'error');
      return;
    }
    if (next.length < 4) {
      showMsg('新密码至少 4 个字符', 'error');
      return;
    }
    if (next !== confirm) {
      showMsg('两次输入的新密码不一致', 'error');
      return;
    }
    try {
      const data = await api('/admin/api/auth/password', {
        method: 'POST',
        body: JSON.stringify({
          current_password: current,
          new_password: next,
        }),
      });
      if (data.session) {
        session = data.session;
        sessionStorage.setItem(SESSION_KEY, session);
      }
      $('current-password').value = '';
      $('new-password').value = '';
      $('confirm-password').value = '';
      showMsg('管理密码已修改', 'ok');
      await refreshStatus();
    } catch (error) {
      showMsg(error.message, 'error');
    }
  }

  $('auth-submit').addEventListener('click', submitAuth);
  $('auth-password').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') submitAuth();
  });
  $('token-logout').addEventListener('click', logoutSession);
  $('refresh').addEventListener('click', () => {
    clearMsg();
    refreshStatus();
  });
  $('verify').addEventListener('click', verifyLogin);
  $('logout').addEventListener('click', async () => {
    if (!confirm('确定退出 B站登录？会清除服务器上的数据目录 Cookie。')) return;
    try {
      const data = await api('/admin/api/logout', { method: 'POST' });
      stopPolling();
      $('user').textContent = '-';
      $('qr-box').innerHTML =
        '<span class="muted">点击下方按钮生成二维码</span>';
      $('qr-status').textContent = '';
      await refreshStatus();
      if (data.warning) showMsg(data.warning, 'warn');
      else showMsg('已退出 B站登录', 'ok');
    } catch (error) {
      showMsg(error.message, 'error');
    }
  });
  $('qr-start').addEventListener('click', async () => {
    stopPolling();
    $('qr-status').textContent = '正在生成二维码…';
    try {
      const data = await api('/admin/api/login/qrcode', { method: 'POST' });
      qrKey = data.qrcode_key;
      $('qr-box').innerHTML = data.svg;
      $('qr-status').textContent = '请使用哔哩哔哩 App 扫码';
      pollTimer = setTimeout(pollLogin, 2000);
    } catch (error) {
      $('qr-status').textContent = '';
      showMsg(error.message, 'error');
    }
  });
  $('save-settings').addEventListener('click', async () => {
    const payload = {
      rate_limit: Number($('rate-limit').value),
      max_concurrency: Number($('max-concurrency').value),
      timeout_secs: Number($('timeout-secs').value),
      allow_write: $('allow-write').checked,
    };
    try {
      const data = await api('/admin/api/settings', {
        method: 'PUT',
        body: JSON.stringify(payload),
      });
      await refreshStatus();
      showMsg(
        data.restart_required
          ? '设置已保存；并发数需要重启容器后生效'
          : '设置已保存并即时生效',
        data.restart_required ? 'warn' : 'ok'
      );
    } catch (error) {
      showMsg(error.message, 'error');
    }
  });
  $('change-password').addEventListener('click', changePassword);

  loadAuthState();
})();

</script>
</body>
</html>
